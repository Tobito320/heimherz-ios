name: iOS CI

on:
  push:
    branches: [main]
  # Modul-Zweige: scripts/ci-fenster.sh startet den Lauf von Hand
  workflow_dispatch:
  pull_request:

# Nur lesen: im öffentlichen Fenster bekommt der Lauf kein Schreibrecht auf das Repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verbotene Muster
        run: |
          fail=0
          if git ls-files | grep -E '\.(p12|mobileprovision|p8|key|pem|cer|csr|cred)$'; then
            echo "::error::Signier-, Schlüssel- oder .cred-Datei im Git"; fail=1
          fi
          if grep -q '^[[:space:]]*packages:' project.yml || git ls-files | grep -q 'Package.resolved'; then
            echo "::error::Swift-Pakete sind nicht erlaubt (0 Abhängigkeiten)"; fail=1
          fi
          # Erlaubt: App Group, Schlüsselbund-Gruppe, AutoFill-Credential-Provider. Für die Foto-Erweiterung nennt Apple keinen eigenen Schlüssel.
          while IFS= read -r datei; do
            if grep -o '<key>[^<]*</key>' "$datei" | grep -v \
                -e 'com.apple.security.application-groups' \
                -e 'keychain-access-groups' \
                -e 'com.apple.developer.authentication-services.autofill-credential-provider'; then
              echo "::error::$datei: nur application-groups, keychain-access-groups und autofill-credential-provider erlaubt"; fail=1
            fi
          done < <(git ls-files '*.entitlements')
          if git grep -n -E 'try!|fatalError\(' -- Heimherz/Sources HeimherzAutoFill/Sources HeimherzFotos/Sources Gemeinsam; then
            echo "::error::try! und fatalError sind im Produktionscode nicht erlaubt (CONSTRAINTS.md)"; fail=1
          fi
          if git grep -n -E '@preconcurrency|nonisolated\(unsafe\)' -- Heimherz/Sources HeimherzAutoFill/Sources HeimherzFotos/Sources Gemeinsam | grep -v 'shortcut:'; then
            echo "::error::@preconcurrency und nonisolated(unsafe) nur mit Kommentar 'shortcut:' in derselben Zeile (CONSTRAINTS.md)"; fail=1
          fi
          exit "$fail"
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  test-iphone:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        timeout-minutes: 6
        run: xcodegen generate
      - name: Test on iPhone
        run: |
          set -euo pipefail
          IPHONE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$IPHONE_ID"
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          # Alte Objektdateien verlinkten nach geänderten Initialisierern veraltete Symbole (Undefined symbols): nie Build-Reste mitnehmen.
          rm -rf derived/Build
          xcodebuild test \
            -project Heimherz.xcodeproj \
            -scheme Heimherz \
            -derivedDataPath derived \
            -destination "platform=iOS Simulator,id=$IPHONE_ID" \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=NO 2>&1 | tee iphone.log
          # grep ohne Treffer endet mit 1: ohne `|| true` ließe pipefail den Schritt bei 0 Warnungen rot werden
          COUNT=$({ grep "warning:" iphone.log || true; } | sort -u | wc -l | tr -d ' ')
          echo "### Compiler-Warnungen: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          { grep "warning:" iphone.log || true; } | sort -u | head -50 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
      # Aussehen ohne Mac prüfen: jede Tab-Seite hell und dunkel (Demo-Argument, nur Debug). Darf den Lauf nie röten.
      - name: Screenshots aufnehmen
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 16
        run: |
          set -u
          mkdir -p screenshots
          IPHONE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          APP=$(find derived/Build/Products -maxdepth 3 -name 'Heimherz.app' | head -n 1)
          test -n "$IPHONE_ID" && test -n "$APP"
          xcrun simctl boot "$IPHONE_ID" || true
          xcrun simctl bootstatus "$IPHONE_ID" -b
          xcrun simctl install "$IPHONE_ID" "$APP"
          for modus in light dark; do
            xcrun simctl ui "$IPHONE_ID" appearance "$modus"
            for tab in passwoerter fotos dateien einstellungen; do
              xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab "$tab"
              sleep 5
              xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-${tab}.png"
            done
            # Unterseiten der Passwörter (Demo springt per -heimherzPwSeite hinein)
            for seite in alle passkeys codes sicherheit geloescht detail import; do
              xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab passwoerter -heimherzPwSeite "$seite"
              sleep 5
              xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-passwoerter-${seite}.png"
            done
            # Passwörter Runde 3 (W-014, W-016, W-017, W-021): Vergleich doppelter Konten, Frühere Passwörter, Codes kurz vor Ablauf (Zeit eingefroren)
            xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab passwoerter -heimherzPwSeite sicherheit -heimherzPwOffen vergleich
            sleep 5
            xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-passwoerter-vergleich.png"
            xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab passwoerter -heimherzPwSeite detail -heimherzPwOffen frueher
            sleep 5
            xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-passwoerter-frueher.png"
            xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab passwoerter -heimherzPwSeite codes -heimherzCodeVorschau YES
            sleep 5
            xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-passwoerter-codes-danach.png"
            # Neue 2FA-Codes (W-028): Auswahl über das Postfach, Rückfrage beim Ersetzen, fertig mit laufendem Code
            for blatt in auswahl ersetzen fertig; do
              xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab passwoerter -heimherzCodeBlatt "$blatt"
              sleep 6
              xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-code-${blatt}.png"
            done
            xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab fotos -heimherzFotosRaster YES
            sleep 5
            xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-fotos-raster.png"
            # Dynamic Type XXL (CONSTRAINTS): nichts darf abgeschnitten sein
            xcrun simctl ui "$IPHONE_ID" content_size extra-extra-large
            xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab fotos -heimherzFotosRaster YES
            sleep 5
            xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-fotos-raster-xxl.png"
            xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab fotos
            sleep 5
            xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-fotos-xxl.png"
            xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab einstellungen
            sleep 5
            xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-einstellungen-xxl.png"
            xcrun simctl ui "$IPHONE_ID" content_size large
            xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab einstellungen -heimherzKoppeln YES
            sleep 5
            xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-koppeln.png"
            xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab einstellungen -heimherzOhnePC YES
            sleep 5
            xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-ungekoppelt.png"
            # Unterseiten der Einstellungen (Demo springt per -heimherzEinstellungenSeite hinein)
            for seite in pc autofill sichern codes; do
              xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzTab einstellungen -heimherzEinstellungenSeite "$seite"
              sleep 5
              xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-einstellungen-${seite}.png"
            done
            # Schnellaktionen vom App-Symbol (Demo legt die Aktion ins Postfach wie das System): Liste Codes, Formular Neues Passwort, Fotos-Tab
            for aktion in codes passwort fotos; do
              xcrun simctl launch --terminate-running-process "$IPHONE_ID" com.onlyus.heimherz -heimherzDemo YES -heimherzAktion "$aktion"
              sleep 6
              xcrun simctl io "$IPHONE_ID" screenshot "screenshots/${modus}-aktion-${aktion}.png"
            done
          done
          ls -l screenshots
      - name: Screenshots hochladen
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 7
      # Zuletzt, damit ein Fehler hier die Screenshots nicht verhindert. Baut App und beide Erweiterungen mit -O und ohne die
      # DEBUG-Zweige, ohne Signatur: so wird die Release-Konfiguration (inkl. ExtensionKit-Einbettung) vor dem ersten TestFlight-Lauf kompiliert.
      - name: Release-Bau ohne Signatur
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Heimherz.xcodeproj \
            -scheme Heimherz \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/release" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SWIFT_TREAT_WARNINGS_AS_ERRORS=NO
          # Die Foto-Erweiterung ist eine ExtensionKit-Erweiterung: sie muss unter Extensions/ liegen, die AutoFill-Erweiterung unter PlugIns/.
          APP=$(find "$RUNNER_TEMP/release/Build/Products" -maxdepth 2 -name 'Heimherz.app' | head -n 1)
          test -n "$APP"
          find "$APP" -name '*.appex' -maxdepth 3
          test -d "$APP/Extensions/HeimherzFotos.appex"
          test -d "$APP/PlugIns/HeimherzAutoFill.appex"
